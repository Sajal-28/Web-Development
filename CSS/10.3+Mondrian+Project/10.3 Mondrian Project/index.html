<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    .body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      
    }
    .container {
      background-color: #000;
      height: 748px;
      width: 748px;
      display: grid;
      grid-template-columns: 320px 360px 50px;
      grid-template-rows: 414px 296px 20px;
      gap: 9px;
    }
    .a{ 
      background-color: #E72F24;
    }
    .d{
      background-color: #F0F1EC;
    }
    .b{
      background-color: #F0F1EC; 
      grid-column: span 2;
    }
    .c{
      background-color: #F0F1EC; 
    }
    .e {
      background-color: #F0F1EC;
      grid-row: span 2;
    }
    .ei {
      background-color: #004592;
      height: 130px;
      border-bottom: 19px solid #000;
    }
    .f {
      background-color: #F0F1EC;
    }
    .g{
      display: grid;
      grid-template-columns: 198px 153px;
      gap: 9px;
    }
    .gi {
      background-color: #F9D01E;
    }
    .gii{
      background-color: #232629;
    }

    
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="container">
     <div class="a"></div>
     <div class="b"></div>
     <div class="c"></div>
     <div class="d"></div>
     <div class="e">
      <div class="ei"> </div>
     </div>
     <div class="f"></div>
     <div class="g">
      <div class="gi"></div>
      <div class="gii"></div>
     </div>
     

    </div> 
</body>

</html>
